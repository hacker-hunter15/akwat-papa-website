<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Akwat Papa Printing Services | Interactive Card</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root { --wine:#7B1E3A; --glow:#ff8fb3; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #hint { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10; color:#fff; background:rgba(123,30,58,.85);
    padding:8px 14px; border-radius:20px; font-size:14px; text-align:center; max-width:88vw; }
  #scan { position:fixed; left:12%; right:12%; height:2px; z-index:9; background:var(--glow); box-shadow:0 0 12px var(--glow);
    animation:sweep 2.4s ease-in-out infinite alternate; }
  @keyframes sweep { from { top:22%; } to { top:72%; } }
  #panel { position:fixed; left:12px; right:12px; top:58px; z-index:11; display:none; color:#fff; padding:14px 16px;
    background:rgba(20,8,12,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,143,179,.55); border-radius:16px; }
  #panel h2 { margin:0 0 4px; font-size:20px; font-weight:600; }
  #panel p { margin:0 0 12px; font-size:14px; line-height:1.4; opacity:.9; }
  #close { position:absolute; top:8px; right:12px; background:none; border:0; color:#fff; font-size:26px; line-height:1; }
  #wa { display:block; text-align:center; background:#25D366; color:#fff; text-decoration:none; font-weight:600;
    padding:11px; border-radius:12px; font-size:15px; }
  #bar { position:fixed; left:10px; right:10px; bottom:14px; z-index:10; display:flex; gap:8px; }
  #bar a { flex:1; text-align:center; text-decoration:none; color:#fff; background:var(--wine); padding:12px 4px;
    border-radius:12px; font-size:14px; font-weight:600; border:1px solid rgba(255,255,255,.25); }
  #err { position:fixed; inset:0; z-index:20; display:none; background:#14080c; color:#fff; padding:28px; text-align:center; }
  #err a { color:var(--glow); }
</style>
</head>
<body>
<div id="hint">Point your camera at the back of your Akwat Papa card</div>
<div id="scan"></div>
<div id="panel"><button id="close" aria-label="Close">&times;</button><h2 id="pt"></h2><p id="pd"></p><a id="wa" href="#">Order on WhatsApp</a></div>
<div id="bar">
  <a id="call" href="#">Call</a>
  <a id="track" href="#">Track order</a>
  <a id="dir" href="#" target="_blank" rel="noopener">Directions</a>
</div>
<div id="err"><h2>The camera could not start</h2><p>Allow camera access in your browser, or open this page in Chrome or Safari.</p><p><a href="/">Go to our website</a></p></div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiScanning: no; uiLoading: no; uiError: no"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera id="cam" position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
    raycaster="far: 10000; objects: .clickable"></a-camera>
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" intensity="1.4" position="0.5 1 1"></a-light>

  <a-entity id="card" mindar-image-target="targetIndex: 0">

    <a-entity class="item" position="-0.32 0 0" rotation="90 0 0" scale="0 0 0"
      animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; easing: easeOutBack; startEvents: pop">
      <a-cone radius-bottom="0.1" radius-top="0.02" height="0.3" position="0 0.15 0" open-ended="true" segments-radial="16"
        material="color:#ff8fb3; shader:flat; opacity:0.2; transparent:true; side:double; depthWrite:false; blending:additive"></a-cone>
      <a-ring radius-inner="0.09" radius-outer="0.105" rotation="-90 0 0" position="0 0.005 0"
        material="color:#ff8fb3; shader:flat; opacity:0.9; transparent:true"
        animation="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; dur: 1100; loop: true; easing: easeInOutSine"></a-ring>
      <a-entity position="0 0.28 0" animation__float="property: position; from: 0 0.26 0; to: 0 0.31 0; dir: alternate; dur: 1700; loop: true; easing: easeInOutSine">
        <a-entity animation__spin="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
          <!-- PLACEHOLDER: replace this block with <a-gltf-model src="./models/banner.glb" scale="0.3 0.3 0.3"></a-gltf-model> -->
          <a-box width="0.16" height="0.4" depth="0.012" color="#7B1E3A"></a-box>
          <a-box width="0.18" height="0.04" depth="0.03" position="0 -0.2 0" color="#eeeeee"></a-box>
        </a-entity>
      </a-entity>
      <a-sphere class="clickable" data-k="banner" radius="0.2" position="0 0.28 0" material="opacity:0; transparent:true"></a-sphere>
      <a-entity look-at="#cam" position="0 0.66 0">
        <a-plane width="0.3" height="0.07" color="#7B1E3A"></a-plane>
        <a-text value="Banners" align="center" width="1" position="0 0 0.01" color="#ffffff"></a-text>
      </a-entity>
    </a-entity>

    <a-entity class="item" position="0 0 0" rotation="90 0 0" scale="0 0 0"
      animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; easing: easeOutBack; startEvents: pop">
      <a-cone radius-bottom="0.1" radius-top="0.02" height="0.3" position="0 0.15 0" open-ended="true" segments-radial="16"
        material="color:#ff8fb3; shader:flat; opacity:0.2; transparent:true; side:double; depthWrite:false; blending:additive"></a-cone>
      <a-ring radius-inner="0.09" radius-outer="0.105" rotation="-90 0 0" position="0 0.005 0"
        material="color:#ff8fb3; shader:flat; opacity:0.9; transparent:true"
        animation="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; dur: 1100; loop: true; easing: easeInOutSine"></a-ring>
      <a-entity position="0 0.28 0" animation__float="property: position; from: 0 0.26 0; to: 0 0.31 0; dir: alternate; dur: 1700; loop: true; easing: easeInOutSine">
        <a-entity animation__spin="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
          <!-- PLACEHOLDER: replace this block with <a-gltf-model src="./models/tshirt.glb" scale="0.3 0.3 0.3"></a-gltf-model> -->
          <a-box width="0.2" height="0.24" depth="0.03" color="#ffffff"></a-box>
          <a-box width="0.07" height="0.07" depth="0.03" position="-0.135 0.085 0" color="#ffffff"></a-box>
          <a-box width="0.07" height="0.07" depth="0.03" position="0.135 0.085 0" color="#ffffff"></a-box>
        </a-entity>
      </a-entity>
      <a-sphere class="clickable" data-k="tshirt" radius="0.2" position="0 0.28 0" material="opacity:0; transparent:true"></a-sphere>
      <a-entity look-at="#cam" position="0 0.66 0">
        <a-plane width="0.3" height="0.07" color="#7B1E3A"></a-plane>
        <a-text value="T-shirts" align="center" width="1" position="0 0 0.01" color="#ffffff"></a-text>
      </a-entity>
    </a-entity>

    <a-entity class="item" position="0.32 0 0" rotation="90 0 0" scale="0 0 0"
      animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; easing: easeOutBack; startEvents: pop">
      <a-cone radius-bottom="0.1" radius-top="0.02" height="0.3" position="0 0.15 0" open-ended="true" segments-radial="16"
        material="color:#ff8fb3; shader:flat; opacity:0.2; transparent:true; side:double; depthWrite:false; blending:additive"></a-cone>
      <a-ring radius-inner="0.09" radius-outer="0.105" rotation="-90 0 0" position="0 0.005 0"
        material="color:#ff8fb3; shader:flat; opacity:0.9; transparent:true"
        animation="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; dur: 1100; loop: true; easing: easeInOutSine"></a-ring>
      <a-entity position="0 0.28 0" animation__float="property: position; from: 0 0.26 0; to: 0 0.31 0; dir: alternate; dur: 1700; loop: true; easing: easeInOutSine">
        <a-entity animation__spin="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
          <!-- PLACEHOLDER: replace this block with <a-gltf-model src="./models/mug.glb" scale="0.3 0.3 0.3"></a-gltf-model> -->
          <a-cylinder radius="0.07" height="0.15" color="#ffffff"></a-cylinder>
          <a-torus radius="0.045" radius-tubular="0.012" position="0.085 0 0" color="#ffffff"></a-torus>
        </a-entity>
      </a-entity>
      <a-sphere class="clickable" data-k="mug" radius="0.2" position="0 0.28 0" material="opacity:0; transparent:true"></a-sphere>
      <a-entity look-at="#cam" position="0 0.66 0">
        <a-plane width="0.3" height="0.07" color="#7B1E3A"></a-plane>
        <a-text value="Mugs" align="center" width="1" position="0 0 0.01" color="#ffffff"></a-text>
      </a-entity>
    </a-entity>

  </a-entity>
</a-scene>

<script>
  const PHONE = "233240431198";
  const TRACK_URL = "https://akwatpapaprintingservices.netlify.app/";
  const MAP_URL = "https://www.google.com/maps/search/?api=1&query=Akwat+Papa+Printing+Services+Aputuogya+Kumasi";
  const ITEMS = {
    banner: { t: "Banners", d: "Roll-up banners, vinyl and flex in any size." },
    tshirt: { t: "T-shirts", d: "Custom T-shirt printing with DTF and heat press." },
    mug:    { t: "Mugs", d: "Personalised mugs for gifts, events and business." }
  };
  const $ = (id) => document.getElementById(id);
  $("call").href = "tel:+" + PHONE;
  $("track").href = TRACK_URL;
  $("dir").href = MAP_URL;

  const card = $("card"), scene = document.querySelector("a-scene");
  const items = [...document.querySelectorAll(".item")];

  card.addEventListener("targetFound", () => {
    $("scan").style.display = "none";
    $("hint").style.display = "none";
    items.forEach((it, i) => setTimeout(() => it.emit("pop"), i * 250));
  });
  card.addEventListener("targetLost", () => {
    $("scan").style.display = "block";
    $("hint").style.display = "block";
    $("panel").style.display = "none";
    items.forEach((it) => it.setAttribute("scale", "0 0 0"));
  });
  scene.addEventListener("arError", () => { $("err").style.display = "block"; });

  document.querySelectorAll(".clickable").forEach((h) => h.addEventListener("click", () => {
    const k = h.dataset.k, it = ITEMS[k];
    $("pt").textContent = it.t;
    $("pd").textContent = it.d;
    $("wa").href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent("Hello Akwat Papa, I want to order: " + it.t);
    $("panel").style.display = "block";
  }));
  $("close").addEventListener("click", () => { $("panel").style.display = "none"; });

  for (let i = 0; i < 24; i++) {
    const s = document.createElement("a-sphere");
    const x = (Math.random() - 0.5) * 1.3, y = (Math.random() - 0.5) * 0.7;
    s.setAttribute("radius", "0.006");
    s.setAttribute("material", "color:#ffd1e0; shader:flat; opacity:0.8; transparent:true");
    s.setAttribute("position", x + " " + y + " 0.02");
    s.setAttribute("animation", "property: position; to: " + x + " " + y + " 0.8; dur: " + Math.round(2200 + Math.random() * 2500) +
      "; loop: true; easing: linear; delay: " + Math.round(Math.random() * 2000));
    card.appendChild(s);
  }
</script>
</body>
  </html>
