<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Akwat Papa Printing Services | Interactive Card</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root { --wine:#7B1E3A; --glow:#ff8fb3; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #hint { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10; color:#fff; background:rgba(123,30,58,.85);
    padding:8px 14px; border-radius:20px; font-size:14px; text-align:center; max-width:88vw; }
  #scan { position:fixed; left:12%; right:12%; height:2px; z-index:9; background:var(--glow); box-shadow:0 0 12px var(--glow);
    animation:sweep 2.4s ease-in-out infinite alternate; }
  @keyframes sweep { from { top:22%; } to { top:72%; } }
  #panel { position:fixed; left:12px; right:12px; top:58px; z-index:11; display:none; color:#fff; padding:14px 16px;
    background:rgba(20,8,12,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,143,179,.55); border-radius:16px; }
  #panel h2 { margin:0 0 4px; font-size:20px; font-weight:600; }
  #panel p { margin:0 0 12px; font-size:14px; line-height:1.4; opacity:.9; }
  #close { position:absolute; top:8px; right:12px; background:none; border:0; color:#fff; font-size:26px; line-height:1; }
  #wa { display:block; text-align:center; background:#25D366; color:#fff; text-decoration:none; font-weight:600;
    padding:11px; border-radius:12px; font-size:15px; }
  #bar { position:fixed; left:10px; right:10px; bottom:14px; z-index:10; display:flex; gap:8px; }
  #bar a { flex:1; text-align:center; text-decoration:none; color:#fff; background:var(--wine); padding:12px 4px;
    border-radius:12px; font-size:14px; font-weight:600; border:1px solid rgba(255,255,255,.25); }
  #err { position:fixed; inset:0; z-index:20; display:none; background:#14080c; color:#fff; padding:28px; text-align:center; }
  #err a { color:var(--glow); }
  .a-enter-vr, .a-enter-ar, .a-orientation-modal { display:none !important; }
</style>
</head>
<body>
<div id="hint">Point your camera at the back of your Akwat Papa card</div>
<div id="scan"></div>
<div id="panel"><button id="close" aria-label="Close">&times;</button><h2 id="pt"></h2><p id="pd"></p><a id="wa" href="#">Order on WhatsApp</a></div>
<div id="bar">
  <a id="call" href="#">Call</a>
  <a id="track" href="#">Track order</a>
  <a id="dir" href="#" target="_blank" rel="noopener">Directions</a>
</div>
<div id="err"><h2>The camera could not start</h2><p>Allow camera access in your browser, or open this page in Chrome or Safari.</p><p><a href="/">Go to our website</a></p></div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiScanning: no; uiLoading: no; uiError: no"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" xr-mode-ui="enabled: false"
